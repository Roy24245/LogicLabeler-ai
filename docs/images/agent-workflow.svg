<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">LogicLabeler annotation pipeline</title>
  <desc id="desc">The batch job optionally retrieves text context from ChromaDB, then runs Commander, Soldier and Critic before replacing and saving annotations. Reviewer is a separately triggered job on saved boxes. Human edits are not automatically written to RAG.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15121E"/><stop offset="1" stop-color="#292038"/></linearGradient>
    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#32283F"/><stop offset="1" stop-color="#211C2B"/></linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#A692C5" stroke-opacity=".06"/></pattern>
    <clipPath id="clip"><rect width="1600" height="850" rx="32"/></clipPath>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#BDA6E9"/></marker>
    <marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#78CBA8"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif}
      .title{font-size:40px;font-weight:700;fill:#FAF7FF;letter-spacing:-1px}
      .subtitle{font-size:23px;fill:#C3B9CF}
      .eyebrow{font-size:17px;font-weight:700;fill:#BDA6E9;letter-spacing:2px}
      .name{font-size:29px;font-weight:700;fill:#FAF7FF}
      .body{font-size:22px;fill:#D4CCDF}
      .small{font-size:20px;fill:#AEA2BF}
      .pill{font-size:19px;font-weight:600;fill:#E6D9FF}
      .line{fill:none;stroke:#BDA6E9;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1600" height="850" fill="url(#bg)"/>
    <rect width="1600" height="850" fill="url(#grid)"/>
    <circle cx="1570" cy="20" r="300" fill="#8D6BBA" opacity=".08"/>
  </g>
  <text x="64" y="63" class="eyebrow">LOGICLABELER / ANNOTATION ENGINE</text>
  <text x="64" y="120" class="title">From a prompt to saved annotations</text>
  <text x="64" y="160" class="subtitle">Batch labeling runs three agents. Dataset review is a separate action.</text>
  <rect x="64" y="207" width="610" height="58" rx="18" fill="#30263F" stroke="#66527F" stroke-dasharray="6 5"/>
  <text x="90" y="243" class="body">Optional: existing ChromaDB text context</text>
  <path d="M220 266V300" class="line" stroke-dasharray="6 5"/>
  <text x="1020" y="244" class="small">One background thread per batch job</text>
  <g transform="translate(64 315)">
    <rect width="322" height="235" rx="24" fill="url(#card)" stroke="#73598D"/>
    <text x="26" y="38" class="eyebrow">01 / PLAN</text>
    <text x="26" y="81" class="name">Commander</text>
    <text x="26" y="126" class="body">Instruction → JSON plan</text>
    <text x="26" y="158" class="body">Targets, prompts, rules</text>
    <rect x="25" y="181" width="272" height="35" rx="10" fill="#4A365F"/>
    <text x="161" y="205" text-anchor="middle" class="pill">Text model</text>
  </g>
  <path d="M398 432H432" class="line"/>
  <g transform="translate(448 315)">
    <rect width="322" height="235" rx="24" fill="url(#card)" stroke="#73598D"/>
    <text x="26" y="38" class="eyebrow">02 / DETECT</text>
    <text x="26" y="81" class="name">Soldier</text>
    <text x="26" y="126" class="body">VLM or Grounding DINO</text>
    <text x="26" y="158" class="body">Pixel-coordinate boxes</text>
    <rect x="25" y="181" width="272" height="35" rx="10" fill="#4A365F"/>
    <text x="161" y="205" text-anchor="middle" class="pill">Optional SAHI tiling</text>
  </g>
  <path d="M782 432H816" class="line"/>
  <g transform="translate(832 315)">
    <rect width="322" height="235" rx="24" fill="url(#card)" stroke="#73598D"/>
    <text x="26" y="38" class="eyebrow">03 / VALIDATE</text>
    <text x="26" y="81" class="name">Critic</text>
    <text x="26" y="126" class="body">Geometric rules</text>
    <text x="26" y="158" class="body">Low-confidence crops</text>
    <rect x="25" y="181" width="272" height="35" rx="10" fill="#4A365F"/>
    <text x="161" y="205" text-anchor="middle" class="pill">VLM check if score &lt; 0.5</text>
  </g>
  <path d="M1166 432H1200" class="line"/>
  <g transform="translate(1216 315)">
    <rect width="320" height="235" rx="24" fill="#20372F" stroke="#65A68C"/>
    <text x="26" y="38" class="eyebrow" style="fill:#85D6B4">04 / PERSIST</text>
    <text x="26" y="81" class="name">Save annotations</text>
    <text x="26" y="126" class="body">Replace image labels</text>
    <text x="26" y="158" class="body">Save classes + progress</text>
    <rect x="25" y="181" width="270" height="35" rx="10" fill="#2E5143"/>
    <text x="160" y="205" text-anchor="middle" class="pill" style="fill:#B2E9D1">SQLite</text>
  </g>
  <path d="M1376 552V603" fill="none" stroke="#78CBA8" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#green)"/>
  <g transform="translate(64 620)">
    <rect width="1472" height="145" rx="24" fill="#221D2C" stroke="#63516F"/>
    <rect x="22" y="24" width="304" height="97" rx="18" fill="#3B2F4B"/>
    <text x="45" y="58" class="eyebrow">SEPARATE REVIEW JOB</text>
    <text x="45" y="96" class="name">Reviewer</text>
    <text x="365" y="57" class="body">Inspect saved crops → status + suggestions → user applies review results</text>
    <text x="365" y="98" class="small">Human edits are not connected to RAG write-back. Review does not adjust box geometry.</text>
  </g>
  <text x="64" y="810" class="small">Source: backend/app/api/labeling.py · services/commander.py · soldier.py · critic.py · reviewer.py</text>
</svg>
