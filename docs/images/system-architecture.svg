<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">LogicLabeler implementation architecture</title>
  <desc id="desc">React, TypeScript, MUI and Zustand communicate through Nginx or Vite with FastAPI. REST serves operations and polling, static routes serve assets, and WebSocket streams training logs. Labeling uses threads, training uses subprocesses, and model adapters call configured providers. SQLite stores metadata, the filesystem holds images and training artifacts, and optional ChromaDB supplies text context.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15121E"/><stop offset="1" stop-color="#292038"/></linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#A692C5" stroke-opacity=".06"/></pattern>
    <clipPath id="clip"><rect width="1600" height="1100" rx="32"/></clipPath>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="#BDA6E9"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif}
      .title{font-size:40px;font-weight:700;fill:#FAF7FF;letter-spacing:-1px}
      .subtitle{font-size:23px;fill:#C3B9CF}
      .eyebrow{font-size:17px;font-weight:700;fill:#BDA6E9;letter-spacing:2px}
      .name{font-size:27px;font-weight:700;fill:#FAF7FF}
      .body{font-size:22px;fill:#D4CCDF}
      .small{font-size:20px;fill:#AEA2BF}
      .line{fill:none;stroke:#BDA6E9;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1600" height="1100" fill="url(#bg)"/>
    <rect width="1600" height="1100" fill="url(#grid)"/>
    <circle cx="1570" cy="20" r="300" fill="#8D6BBA" opacity=".08"/>
  </g>
  <text x="64" y="63" class="eyebrow">LOGICLABELER / SYSTEM MAP</text>
  <text x="64" y="120" class="title">One workspace, three implementation layers</text>
  <text x="64" y="160" class="subtitle">Browser interaction → API orchestration → models and persistent data</text>
  <g transform="translate(64 202)">
    <rect width="1472" height="124" rx="24" fill="#30263E" stroke="#73598D"/>
    <text x="28" y="44" class="name">React 18 + TypeScript</text>
    <text x="28" y="82" class="body">MUI 6 · Zustand · Axios</text>
    <path d="M420 28V96" stroke="#625171"/>
    <text x="458" y="44" class="body">Datasets · Annotation canvas · AI labeling · Review</text>
    <text x="458" y="82" class="body">Augmentation · Training dashboard · Provider settings</text>
  </g>
  <path d="M800 328V361" class="line"/>
  <rect x="64" y="378" width="1472" height="100" rx="22" fill="#211D2A" stroke="#5A4B68"/>
  <text x="91" y="417" class="name">Nginx / Vite proxy</text>
  <text x="91" y="450" class="small">Docker / development</text>
  <text x="470" y="417" class="body">/api — REST + progress polling</text>
  <text x="470" y="450" class="body">/static — images + model files</text>
  <text x="1070" y="417" class="body">/ws/logs/{job_id}</text>
  <text x="1070" y="450" class="small">Training log stream only</text>
  <path d="M800 480V513" class="line"/>
  <g transform="translate(64 530)">
    <rect width="1472" height="290" rx="24" fill="#211B2B" stroke="#806398"/>
    <text x="28" y="45" class="name">FastAPI + SQLAlchemy</text>
    <text x="460" y="44" class="small">REST routes · job state · runtime settings · static files</text>
    <g transform="translate(24 74)">
      <rect width="450" height="190" rx="18" fill="#30263F"/>
      <text x="24" y="38" class="eyebrow">ANNOTATION SERVICES</text>
      <text x="24" y="80" class="body">Commander → Soldier → Critic</text>
      <text x="24" y="116" class="body">Separate Reviewer / GrabCut</text>
      <text x="24" y="153" class="small">Batch jobs: background threads</text>
    </g>
    <g transform="translate(511 74)">
      <rect width="450" height="190" rx="18" fill="#30263F"/>
      <text x="24" y="38" class="eyebrow">MODELS + ADAPTERS</text>
      <text x="24" y="80" class="body">Text · Soldier · Vision roles</text>
      <text x="24" y="116" class="body">DashScope · OpenAI-compatible</text>
      <text x="24" y="153" class="body">Anthropic · local DINO option</text>
    </g>
    <g transform="translate(998 74)">
      <rect width="450" height="190" rx="18" fill="#25382F"/>
      <text x="24" y="38" class="eyebrow" style="fill:#85D6B4">DATA + TRAINING</text>
      <text x="24" y="80" class="body">Import · edit · split · YOLO export</text>
      <text x="24" y="116" class="body">DashScope image augmentation</text>
      <text x="24" y="153" class="small">YOLO: subprocess per training job</text>
    </g>
  </g>
  <path d="M800 822V859" class="line"/>
  <path d="M800 841H300V859" class="line"/>
  <path d="M800 841H1300V859" class="line"/>
  <g transform="translate(64 877)">
    <rect width="472" height="145" rx="22" fill="#2A2235" stroke="#66527F"/>
    <text x="28" y="43" class="name">SQLite</text>
    <text x="28" y="82" class="body">Datasets · annotations · jobs</text>
    <text x="28" y="115" class="small">Settings and model selections</text>
  </g>
  <g transform="translate(564 877)">
    <rect width="472" height="145" rx="22" fill="#2A2235" stroke="#66527F"/>
    <text x="28" y="43" class="name">Filesystem</text>
    <text x="28" y="82" class="body">Images · training snapshots</text>
    <text x="28" y="115" class="small">Logs · plots · checkpoints</text>
  </g>
  <g transform="translate(1064 877)">
    <rect width="472" height="145" rx="22" fill="#2A2235" stroke="#66527F" stroke-dasharray="6 5"/>
    <text x="28" y="43" class="name">ChromaDB</text>
    <text x="28" y="82" class="body">Optional text error memory</text>
    <text x="28" y="115" class="small">Retrieved before Commander</text>
  </g>
  <text x="64" y="1066" class="small">Source: frontend/src · frontend/nginx.conf · backend/app · docker-compose.yml</text>
</svg>
